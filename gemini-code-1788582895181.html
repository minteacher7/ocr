<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 OCR 및 PDF 변환기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="text-center">
            <h1 class="text-3xl font-bold text-slate-800">이미지 OCR & PDF 변환기</h1>
            <p class="text-slate-500 mt-2">이미지 속 텍스트를 감지하여 PDF 문서로 변환합니다.</p>
        </header>

        <!-- API Key Input Block -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <label for="apiKey" class="block text-sm font-semibold text-slate-700 mb-2">Google AI Studio API 키</label>
            <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
            <p class="text-xs text-slate-400 mt-1">입력된 API 키는 브라우저에만 유지되며 외부 서버에 저장되지 않습니다.</p>
        </section>

        <!-- Main Workspace Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Upload & Preview Area -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">1. 이미지 업로드</h2>
                
                <label class="flex flex-col items-center justify-center w-full h-48 border-2 border-dashed border-slate-300 rounded-lg cursor-pointer hover:bg-slate-50 transition mb-4">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-8 h-8 mb-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <p class="text-sm text-slate-500 font-medium">클릭하여 이미지 선택</p>
                    </div>
                    <input type="file" id="imageInput" accept="image/*" class="hidden">
                </label>

                <!-- Image Preview -->
                <div class="flex-1 flex items-center justify-center bg-slate-100 rounded-lg overflow-hidden min-h-[150px] mb-4">
                    <img id="imagePreview" class="hidden max-h-60 object-contain" alt="미리보기">
                    <span id="previewPlaceholder" class="text-slate-400 text-sm">이미지를 선택하면 여기에 표시됩니다</span>
                </div>

                <button id="ocrBtn" onclick="processOCR()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition disabled:bg-slate-300" disabled>
                    텍스트 추출 (OCR)
                </button>
            </section>

            <!-- Text Result & PDF Export Area -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                <h2 class="text-lg font-semibold text-slate-800 mb-4">2. 추출 결과 & PDF 저장</h2>
                
                <!-- Status Message -->
                <div id="status" class="hidden text-sm font-medium mb-3 p-3 rounded-lg"></div>

                <!-- Textarea / Output view -->
                <div class="flex-1 mb-4 flex flex-col">
                    <textarea id="ocrOutput" class="w-full flex-1 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm resize-none" placeholder="추출된 텍스트가 여기에 표시되며, 수정한 내용도 PDF로 저장됩니다."></textarea>
                </div>

                <button id="pdfBtn" onclick="downloadPDF()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition disabled:bg-slate-300" disabled>
                    PDF로 저장하기
                </button>
            </section>

        </div>
    </div>

    <!-- Hidden Container for UTF-8 Clean PDF Generation -->
    <div id="pdfContent" class="hidden p-8 font-sans leading-relaxed text-slate-900"></div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const ocrBtn = document.getElementById('ocrBtn');
        const pdfBtn = document.getElementById('pdfBtn');
        const ocrOutput = document.getElementById('ocrOutput');
        const statusDiv = document.getElementById('status');
        let selectedBase64 = '';
        let selectedMimeType = '';

        // Handle Image Selection
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            selectedMimeType = file.type;
            const reader = new FileReader();
            
            reader.onload = (event) => {
                selectedBase64 = event.target.result.split(',')[1];
                imagePreview.src = event.target.result;
                imagePreview.classList.remove('hidden');
                previewPlaceholder.classList.add('hidden');
                ocrBtn.disabled = false;
            };

            reader.readAsDataURL(file);
        });

        // OCR Processing using Gemini 3.6 Flash API
        async function processOCR() {
            const apiKey = document.getElementById('apiKey').value.trim();
            
            if (!apiKey) {
                showStatus('Google AI Studio API 키를 입력해 주세요.', 'bg-red-50 text-red-600');
                return;
            }

            showStatus('이미지 분석 중...', 'bg-blue-50 text-blue-600');
            ocrBtn.disabled = true;

            try {
                // 모델명을 gemini-3.6-flash 로 업데이트
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Extract all text from this image as accurately as possible. Maintain the original structure, formatting, and language without adding commentary." },
                                {
                                    inlineData: {
                                        mimeType: selectedMimeType,
                                        data: selectedBase64
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'API 요청 실패');
                }

                const extractedText = data.candidates?.[0]?.content?.parts?.[0]?.text || '텍스트를 감지하지 못했습니다.';
                ocrOutput.value = extractedText;
                pdfBtn.disabled = false;
                showStatus('텍스트 추출 완료!', 'bg-emerald-50 text-emerald-600');

            } catch (err) {
                showStatus(`오류 발생: ${err.message}`, 'bg-red-50 text-red-600');
            } finally {
                ocrBtn.disabled = false;
            }
        }

        // Export Extracted Text to PDF
        function downloadPDF() {
            const text = ocrOutput.value.trim();
            if (!text) return;

            const pdfContent = document.getElementById('pdfContent');
            pdfContent.innerHTML = text.replace(/\n/g, '<br>');

            const options = {
                margin: 15,
                filename: 'extracted-ocr-document.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(options).from(pdfContent).save();
        }

        function showStatus(msg, classes) {
            statusDiv.className = `text-sm font-medium mb-3 p-3 rounded-lg ${classes}`;
            statusDiv.innerText = msg;
            statusDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
